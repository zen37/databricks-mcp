command:
  - "python"
  - "weather_mcp_server.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  # Open-Meteo needs no API key, so there are no secrets to configure here.
  # These are just endpoint/unit defaults; override them to switch providers,
  # units, or thresholds without touching code.
  - name: WEATHER_API_BASE
    value: "https://api.open-meteo.com/v1/forecast"
  - name: GEOCODING_API_BASE
    value: "https://geocoding-api.open-meteo.com/v1/search"
  - name: WEATHER_TEMP_UNIT
    value: "fahrenheit"
  - name: WEATHER_WIND_UNIT
    value: "mph"
  - name: WEATHER_PRECIP_UNIT
    value: "inch"
  - name: UMBRELLA_PROB_THRESHOLD
    value: "40"
  - name: UMBRELLA_PRECIP_THRESHOLD
    value: "0.1"
  - name: JACKET_TEMP_THRESHOLD
    value: "50"
  - name: WINDY_THRESHOLD
    value: "25"
